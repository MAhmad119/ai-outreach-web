<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Outreach Message Generator | Micro-SaaS Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <header class="border-b border-slate-800 p-4">
    <div class="max-w-4xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-2xl">⚡</span>
        <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 to-cyan-400 bg-clip-text text-transparent">OutreachAI</h1>
      </div>
      <span class="bg-indigo-500/10 text-indigo-400 text-xs px-3 py-1 rounded-full border border-indigo-500/20">v1.0 Micro-SaaS</span>
    </div>
  </header>

  <main class="max-w-4xl mx-auto w-full px-4 py-10">
    <div class="text-center mb-8">
      <h2 class="text-3xl md:text-4xl font-extrabold mb-3">Instant AI Cold Email & Message Personalizer</h2>
      <p class="text-slate-400 text-sm md:text-base">Generate high-converting outreach messages for leads in seconds.</p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl">
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Prospect Name / Company</label>
          <input type="text" id="prospectName" placeholder="e.g. Sarah / Alex Tech Solutions" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-indigo-500 focus:outline-none transition">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 uppercase mb-1">Outreach Goal</label>
          <select id="goal" class="w-full bg-slate-950 border border-slate-800 rounded-lg p-3 text-sm focus:border-indigo-500 focus:outline-none transition text-slate-300">
            <option value="sales">Sales & Cold Email</option>
            <option value="collaboration">Business Collaboration</option>
            <option value="freelance">Freelance Pitch</option>
          </select>
        </div>

        <button id="generateBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-lg shadow-lg transition">
          Generate Message 🚀
        </button>
      </div>

      <div class="flex flex-col justify-between bg-slate-950 border border-slate-800 p-4 rounded-xl">
        <div>
          <div class="flex justify-between items-center mb-2">
            <span class="text-xs font-semibold text-slate-400 uppercase">Generated Message</span>
            <span id="badge" class="hidden text-[10px] bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20">Generated</span>
          </div>
          <textarea id="output" rows="6" readonly class="w-full bg-transparent text-slate-200 text-sm focus:outline-none resize-none" placeholder="Your AI generated message will appear here..."></textarea>
        </div>

        <button id="copyBtn" class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium py-2 rounded-lg transition">
          📋 Copy to Clipboard
        </button>
      </div>
    </div>
  </main>

  <footer class="border-t border-slate-900 p-4 text-center text-xs text-slate-500">
    Clean Client-Side Micro-SaaS Tool • Hosted on Vercel
  </footer>

  <script>
    document.getElementById('generateBtn').addEventListener('click', () => {
      const name = document.getElementById('prospectName').value.trim();
      const goal = document.getElementById('goal').value;
      const outputBox = document.getElementById('output');
      const badge = document.getElementById('badge');

      if (!name) {
        outputBox.value = "Please enter a prospect name or company first!";
        badge.classList.add('hidden');
        return;
      }

      const templates = {
        sales: [
          `Hi ${name},\n\nI came across your work and was really impressed by your recent growth. I help businesses like yours automate workflows and save 10+ hours weekly.\n\nWould you be open to a quick 5-minute chat this week?`,
          `Hey ${name},\n\nNotice you're scaling operations at ${name}. We recently built a tool that cuts lead response time in half.\n\nMind if I send over a 1-minute video demo?`
        ],
        collaboration: [
          `Hello ${name},\n\nLoved your latest project! Your approach to design and product structure is super clean.\n\nI’m currently working on similar micro-SaaS assets and would love to connect and explore potential synergies.`,
          `Hi ${name},\n\nFollowing your updates for a while now. I think a joint effort between our workflows could add massive value for both our audiences. Let's touch base!`
        ],
        freelance: [
          `Hi ${name},\n\nI noticed a few areas where your web platform performance could be optimized for higher conversion rates.\n\nI specialize in clean frontend tools and modern UIs. Would love to share 2 quick ideas with you!`
        ]
      };

      const selectedList = templates[goal] || templates.sales;
      const randomMessage = selectedList[Math.floor(Math.random() * selectedList.length)];

      outputBox.value = randomMessage;
      badge.classList.remove('hidden');
    });

    document.getElementById('copyBtn').addEventListener('click', () => {
      const outputBox = document.getElementById('output');
      if (outputBox.value && !outputBox.value.startsWith("Please enter")) {
        navigator.clipboard.writeText(outputBox.value);
        alert('Message copied to clipboard!');
      }
    });
  </script>
</body>
</html>
