<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant AI Cold Email & Message Personalizer</title>
    <!-- Tailwind CSS CDN for clean styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans selection:bg-indigo-500 selection:text-white">

    <!-- Main Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        
        <!-- Header Section -->
        <div class="text-center max-w-2xl mb-8">
            <h1 class="text-3xl md:text-4xl font-extrabold tracking-tight text-white mb-2">
                Instant AI Cold Email & Message Personalizer
            </h1>
            <p class="text-slate-400 text-sm md:text-base">
                Generate high-converting outreach messages for leads in seconds.
            </p>
        </div>

        <!-- Card Section -->
        <div class="w-full max-w-xl bg-slate-900/80 border border-slate-800 rounded-2xl p-6 md:p-8 shadow-2xl backdrop-blur-md">
            
            <!-- Prospect Input -->
            <div class="mb-5">
                <label for="prospectName" class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Prospect Name / Company
                </label>
                <input 
                    type="text" 
                    id="prospectName" 
                    placeholder="e.g. Ahmad or TechCorp" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 transition-colors text-sm"
                >
            </div>

            <!-- Outreach Goal Selection -->
            <div class="mb-6">
                <label for="goal" class="block text-xs font-semibold tracking-wider text-slate-400 uppercase mb-2">
                    Outreach Goal
                </label>
                <select 
                    id="goal" 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-slate-100 focus:outline-none focus:border-indigo-500 transition-colors text-sm cursor-pointer"
                >
                    <option value="sales">Sales & Cold Email</option>
                    <option value="collaboration">Business Collaboration</option>
                    <option value="freelance">Freelance Pitch</option>
                </select>
            </div>

            <!-- Generate Button -->
            <button 
                id="generateBtn" 
                class="w-full bg-indigo-600 hover:bg-indigo-500 active:scale-[0.99] text-white font-semibold py-3.5 px-6 rounded-xl transition-all duration-200 shadow-lg shadow-indigo-600/20 flex items-center justify-center gap-2 text-sm mb-6"
            >
                <span>Generate Message</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
                </svg>
            </button>

            <!-- Output Section -->
            <div class="relative">
                <div class="flex items-center justify-between mb-2">
                    <label for="output" class="text-xs font-semibold tracking-wider text-slate-400 uppercase">
                        Generated Message
                    </label>
                    <span id="badge" class="hidden text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-medium">
                        Generated
                    </span>
                </div>
                
                <textarea 
                    id="output" 
                    rows="6" 
                    readonly 
                    placeholder="Your generated outreach message will appear here..." 
                    class="w-full bg-slate-950 border border-slate-800 rounded-xl p-4 text-slate-200 placeholder-slate-600 focus:outline-none text-sm resize-none mb-3"
                ></textarea>

                <!-- Copy to Clipboard Button -->
                <button 
                    id="copyBtn" 
                    class="w-full bg-slate-800 hover:bg-slate-700 active:scale-[0.99] text-slate-200 font-medium py-2.5 px-4 rounded-xl transition-all duration-200 flex items-center justify-center gap-2 text-xs border border-slate-700/50"
                >
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    <span>Copy to Clipboard</span>
                </button>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-500 border-t border-slate-900">
        Clean Client-Side Micro-SaaS Tool • Hosted on Vercel
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const prospectInput = document.getElementById('prospectName');
        const goalSelect = document.getElementById('goal');
        const outputBox = document.getElementById('output');
        const badge = document.getElementById('badge');

        // Message templates for each outreach goal
        const templates = {
            sales: [
                (name) => `Hi ${name},\n\nI came across your business and was impressed by what you're building. I help businesses improve their digital workflow and generate better results.\n\nWould you be interested in exploring a potential solution?`,
                (name) => `Hello ${name},\n\nI noticed your company is growing and thought I could share an idea that may help improve your business operations.\n\nWould you be open to a quick conversation this week?`,
                (name) => `Hey ${name},\n\nI work with businesses looking to save time and improve productivity through smart digital solutions.\n\nI'd love to show you how we could potentially help your team. Interested?`,
                (name) => `Hi ${name},\n\nI recently discovered your company and wanted to reach out. I believe there may be an opportunity to help you improve your online business performance.\n\nCan I share a few ideas with you?`,
                (name) => `Hello ${name},\n\nYour business caught my attention, and I wanted to introduce myself. I specialize in helping businesses find practical digital solutions.\n\nWould you have a few minutes to connect?`,
                (name) => `Hi ${name},\n\nI have been exploring businesses in your industry and noticed your company. I believe there could be a valuable opportunity for us to work together.\n\nWould you be interested in discussing it?`
            ],
            collaboration: [
                (name) => `Hello ${name},\n\nI've been checking out your work and really appreciate your approach. I'm currently building digital products and exploring meaningful business partnerships.\n\nI'd love to connect and discuss possible collaboration opportunities.`,
                (name) => `Hi ${name},\n\nI think our interests in digital products and technology could create an interesting opportunity.\n\nWould you be interested in connecting and exploring ways we could collaborate?`,
                (name) => `Hey ${name},\n\nYour recent projects caught my attention. I'm working on some exciting digital ideas and believe there could be potential for a productive partnership.\n\nLet's connect if you're interested!`,
                (name) => `Hello ${name},\n\nI'm reaching out because I see potential for collaboration between our work. I enjoy connecting with people building innovative digital solutions.\n\nWould you be open to discussing some ideas?`,
                (name) => `Hi ${name},\n\nI admire the work you're doing and would love to explore whether we could create something valuable together.\n\nPerhaps we could exchange ideas and see where a partnership might lead?`,
                (name) => `Hey ${name},\n\nI'm always looking to connect with creative professionals and entrepreneurs. Your work looks interesting, and I'd love to explore possible ways we could support each other's projects.\n\nInterested in connecting?`
            ],
            freelance: [
                (name) => `Hi ${name},\n\nI came across your business and noticed an opportunity to improve your online presence. I specialize in modern frontend development and clean website interfaces.\n\nI'd love to share a few ideas that could benefit your business.`,
                (name) => `Hello ${name},\n\nI'm a freelance web developer focused on building responsive, modern and user-friendly websites.\n\nI'd be interested in helping with your next web project. Are you currently looking for development support?`,
                (name) => `Hey ${name},\n\nI help businesses create professional web experiences with clean designs and smooth functionality.\n\nI'd love to learn about your current requirements and see if I can help with your project.`,
                (name) => `Hi ${name},\n\nI specialize in creating lightweight web tools, landing pages and modern frontend interfaces.\n\nIf you're planning any website improvements, I'd be happy to discuss how I could contribute.`,
                (name) => `Hello ${name},\n\nI noticed your company and wanted to introduce my freelance services. I focus on building professional websites that look great across desktop and mobile devices.\n\nWould you be open to discussing a potential project?`,
                (name) => `Hi ${name},\n\nI'm currently available for freelance web development projects. I can help with frontend interfaces, landing pages and custom web utilities.\n\nIf you need development assistance, I'd love to connect and discuss your requirements.`
            ]
        };

        let lastMessage = "";

        generateBtn.addEventListener('click', () => {
            const name = prospectInput.value.trim();
            const goal = goalSelect.value;

            if (!name) {
                outputBox.value = "Please enter a prospect name or company first!";
                badge.classList.add('hidden');
                return;
            }

            const selectedTemplates = templates[goal] || templates.sales;
            let randomIndex;

            do {
                randomIndex = Math.floor(Math.random() * selectedTemplates.length);
            } while (
                selectedTemplates.length > 1 &&
                selectedTemplates[randomIndex](name) === lastMessage
            );

            const randomMessage = selectedTemplates[randomIndex](name);
            lastMessage = randomMessage;

            outputBox.value = randomMessage;
            badge.classList.remove('hidden');
        });

        copyBtn.addEventListener('click', async () => {
            const message = outputBox.value;

            if (!message || message.startsWith("Please enter")) {
                return;
            }

            try {
                await navigator.clipboard.writeText(message);
                alert('Message copied to clipboard!');
            } catch (error) {
                outputBox.select();
                document.execCommand('copy');
                alert('Message copied to clipboard!');
            }
        });
    </script>
</body>
</html>
